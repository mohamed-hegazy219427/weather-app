<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Live 1–3 day weather forecast for any city, powered by WeatherAPI.com" />
    <meta name="author" content="Mohamed Hegazy" />
    <title>Weather App</title>
    <link rel="shortcut icon" href="/weather/64x64/day/116.png" type="image/x-icon" />

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="/css/all.min.css" />
    <link rel="stylesheet" href="/css/bootstrap.min.css" />

  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg p-5">
        <div class="container justify-content-between">
          <a class="navbar-brand d-flex align-items-center gap-3" href="#">
            <img src="/weather/64x64/day/116.png" alt="Weather App logo" class="w-100" style="max-width:64px" />
            <div class="brand-name">
              <h1>Weather</h1>
              <p>Your daily forecast</p>
            </div>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link text-white me-5 rounded-pill px-3" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link text-white me-5 rounded-pill px-3" href="#">News</a></li>
              <li class="nav-item"><a class="nav-link text-white me-5 rounded-pill px-3" href="#">Live cameras</a></li>
              <li class="nav-item"><a class="nav-link text-white me-5 rounded-pill px-3" href="#">Photos</a></li>
              <li class="nav-item"><a class="nav-link text-white me-5 rounded-pill px-3" href="#">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="hero p-5">
        <div class="container">
          <form class="find-location position-relative" id="search-form">
            <input
              type="text"
              placeholder="Find your location..."
              id="search"
              class="form-control rounded-pill"
              autocomplete="off"
            />
            <input type="button" value="Find" id="submit" class="btn btn-primary rounded-pill px-5" />
          </form>
          <div class="dropdown mt-3">
            <button
              class="btn btn-outline-dark text-white dropdown-toggle"
              type="button"
              id="triggerId"
              data-bs-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Days
            </button>
            <div class="dropdown-menu bg-dark-subtle text-white" aria-labelledby="triggerId">
              <button class="dropdown-item" value="1">1 day</button>
              <button class="dropdown-item" value="2">2 days</button>
              <button class="dropdown-item" value="3">3 days</button>
            </div>
          </div>
        </div>
      </div>

      <div class="position-relative">
        <div class="container">
          <div class="forecast-cards" id="forecast-cards"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
        <p class="mb-0">&copy; 2025 Weather App · Mohamed Hegazy</p>
        <div class="social-links">
          <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
          <a href="#" aria-label="Google Plus"><i class="fa-brands fa-google-plus"></i></a>
          <a href="#" aria-label="Pinterest"><i class="fa-brands fa-pinterest"></i></a>
        </div>
      </div>
    </footer>

    <!-- Vendor JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
