<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- Prevent flash of wrong theme before CSS loads -->
    <script>
      (function () {
        var t = localStorage.getItem("weather-theme");
        if (t) document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="Live 1–3 day weather forecast for any city, powered by WeatherAPI.com"
    />
    <meta name="author" content="Mohamed Hegazy" />
    <title>Weather App</title>
    <link
      rel="shortcut icon"
      href="/weather/64x64/day/116.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/css/all.min.css" />
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>

  <body>
    <header>
      <nav class="navbar p-4">
        <div
          class="container d-flex align-items-center justify-content-between"
        >
          <a class="navbar-brand d-flex align-items-center gap-3" href="#">
            <img
              src="/weather/64x64/day/116.png"
              alt="Weather App logo"
              style="width: 52px; height: 52px"
            />
            <div class="brand-name">
              <h1>Weather</h1>
              <p>Your daily forecast</p>
            </div>
          </a>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
          >
            <i class="fa-solid fa-sun" id="theme-icon"></i>
          </button>
        </div>
      </nav>
    </header>

    <main>
      <div class="hero p-5">
        <div class="container hero__content">
          <form class="find-location position-relative" id="search-form">
            <input
              type="text"
              placeholder="Find your location..."
              id="search"
              class="form-control rounded-pill"
              autocomplete="off"
            />
            <input
              type="button"
              value="Find"
              id="submit"
              class="btn btn-primary rounded-pill px-5"
            />
          </form>
          <div class="dropdown mt-3">
            <button
              class="days-dropdown-btn dropdown-toggle"
              type="button"
              id="triggerId"
              data-bs-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Days
            </button>
            <div class="dropdown-menu" aria-labelledby="triggerId">
              <button class="dropdown-item" value="1">1 day</button>
              <button class="dropdown-item" value="2">2 days</button>
              <button class="dropdown-item" value="3">3 days</button>
            </div>
          </div>
        </div>
      </div>

      <div class="position-relative">
        <div class="container">
          <div class="forecast-cards" id="forecast-cards"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div
        class="container d-flex align-items-center justify-content-between flex-wrap gap-3"
      >
        <p class="mb-0">&copy; 2025 Weather App &middot; Mohamed Hegazy</p>
        <div class="social-links">
          <a href="#" aria-label="Facebook"
            ><i class="fa-brands fa-facebook-f"></i
          ></a>
          <a href="#" aria-label="Twitter"
            ><i class="fa-brands fa-twitter"></i
          ></a>
          <a href="#" aria-label="Google Plus"
            ><i class="fa-brands fa-google-plus"></i
          ></a>
          <a href="#" aria-label="Pinterest"
            ><i class="fa-brands fa-pinterest"></i
          ></a>
        </div>
      </div>
    </footer>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
